name: Import ben-ux-writing package

on:
  push:
    paths:
      - upload/READY

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and commit package
        shell: bash
        run: |
          set -euo pipefail
          test -f upload/READY || exit 0
          cat upload/part-* | base64 -d > /tmp/ben-ux-writing-upload.tar.gz
          tar -xzf /tmp/ben-ux-writing-upload.tar.gz
          rm -rf upload
          rm -f .github/workflows/import-package.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import ben-ux-writing v0.1.1"
          git push
